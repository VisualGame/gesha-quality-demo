<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shelf Quality Lab</title><style>@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box}body{margin:0;background:#f7f7f5;color:#222521;font-family:Manrope,Arial,sans-serif}.top{height:70px;background:white;border-bottom:1px solid #e8e8e5;display:flex;align-items:center;justify-content:space-between;padding:0 38px}.brand{font-size:26px;font-weight:800;letter-spacing:.09em}.brand span{font-size:10px;letter-spacing:.3em;color:#8a8f87;margin-left:6px}.topright{font-size:10px;letter-spacing:.18em;color:#7a8079;font-weight:700}.dot{display:inline-block;width:7px;height:7px;background:#79a181;border-radius:50%;margin-left:15px}.layout{height:calc(100vh - 70px);min-height:590px;display:grid;grid-template-columns:minmax(0,1fr) 385px}.viewport{position:relative;min-width:0;overflow:hidden}.viewport #canvas{position:absolute;inset:0}.viewport canvas{display:block;width:100%;height:100%}.hint{position:absolute;z-index:1;top:27px;left:34px;font-size:11px;color:#8a8c88;pointer-events:none}.view-actions{position:absolute;z-index:1;bottom:27px;left:30px;display:flex;gap:8px}.view-actions button{background:#fffdf9;border:1px solid #dddcd6;border-radius:5px;padding:12px 16px;font:600 11px Manrope;cursor:pointer;color:#3a3e39}.sidebar{background:white;border-left:1px solid #e9e8e4;padding:31px 32px;overflow-y:auto}.eyebrow{font-size:10px;color:#999b96;letter-spacing:.19em;font-weight:800}h1{font-size:28px;letter-spacing:-.05em;margin:10px 0 8px}.subtitle{color:#858a84;font-size:12px;line-height:1.8;margin:0 0 24px}.section-title{border-top:1px solid #ecece9;padding-top:19px;margin-top:19px;color:#aaa;font-size:11px;font-weight:800;letter-spacing:.08em}.section-title span{margin-left:12px;color:#41463f}.control{margin-top:18px}.control-head,.limits,.spec{display:flex;justify-content:space-between;align-items:center}.control-head{font-size:12px}.control-head strong{font-size:13px}.limits{font-size:10px;color:#a3a6a0;margin-top:2px}input[type=range]{width:100%;accent-color:#252a25;margin:13px 0 4px;cursor:pointer}.swatches{display:flex;gap:11px;margin-top:17px}.swatch{width:36px;height:36px;background:var(--swatch);border:3px solid white;box-shadow:0 0 0 1px #e0e0dc;border-radius:50%;cursor:pointer}.swatch.selected{box-shadow:0 0 0 2px #282c27}.finish{font-size:11px;color:#777d74;margin-top:12px}.spec{padding:9px 0;font-size:12px;color:#777d74}.spec strong{color:#2a2e28}.disclaimer{font-size:10px;color:#a3a6a0;line-height:1.7;margin:14px 0 0}.pricebox{margin-top:24px;background:#f5f5f2;padding:20px;display:flex;flex-direction:column;gap:7px}.pricebox span{font-size:11px;color:#737a71}.pricebox strong{font-size:28px;letter-spacing:-.05em}.pricebox small{color:#9a9d97;font-size:10px}.primary{margin-top:12px;background:#272c28;color:white;border:0;padding:17px 12px;width:100%;font:700 12px Manrope;cursor:pointer}.primary:hover{background:#4b584c}@media(max-width:800px){.top{height:58px;padding:0 16px}.brand{font-size:21px}.topright{font-size:8px}.layout{height:auto;min-height:0;display:flex;flex-direction:column}.viewport{height:55vh;min-height:360px}.sidebar{border-left:0;border-top:1px solid #e9e8e4;padding:24px}.hint{left:16px;top:15px;font-size:10px}.view-actions{left:12px;bottom:12px}.view-actions button{font-size:10px;padding:10px}.sidebar{overflow:visible}}
</style><script type="importmap">{"imports":{"three":"https://esm.sh/three@0.180.0","three/addons/":"https://esm.sh/three@0.180.0/examples/jsm/"}}</script></head><body><div id="app"></div><script type="module">import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';


const app = document.querySelector('#app');
app.innerHTML = `
<header class="top"><div class="brand">SHELF <span>QUALITY LAB</span></div><div class="topright">ДЕМОНСТРАЦИЯ КАЧЕСТВА <span class="dot"></span> 3D</div></header>
<main class="layout"><section class="viewport"><div class="hint">Перетащите для вращения · Колёсико для масштаба</div><div id="canvas"></div><div class="view-actions"><button id="reset" title="Сбросить камеру">↺ Вид спереди</button><button id="shot">↓ HD-снимок 4K</button></div></section>
<aside class="sidebar"><div class="eyebrow">КОНФИГУРАТОР МЕБЕЛИ</div><h1>Фотореализм в браузере</h1><p class="subtitle">Демо Three.js: свет, PBR, фаски, процедурная текстура дерева и живое изменение размеров.</p>
<div class="section-title">01 <span>ГАБАРИТЫ</span></div>
<div class="control"><div class="control-head"><label for="width">Ширина</label><strong><output id="widthVal">1800</output> мм</strong></div><input id="width" type="range" min="800" max="3000" step="50" value="1800"/><div class="limits"><span>800 мм</span><span>3000 мм</span></div></div>
<div class="control"><div class="control-head"><label for="height">Высота</label><strong><output id="heightVal">2000</output> мм</strong></div><input id="height" type="range" min="900" max="2600" step="50" value="2000"/><div class="limits"><span>900 мм</span><span>2600 мм</span></div></div>
<div class="control"><div class="control-head"><label for="depth">Глубина</label><strong><output id="depthVal">350</output> мм</strong></div><input id="depth" type="range" min="250" max="600" step="25" value="350"/><div class="limits"><span>250 мм</span><span>600 мм</span></div></div>
<div class="section-title">02 <span>ОТДЕЛКА</span></div><div class="swatches" id="swatches"><button class="swatch selected" data-material="oak" aria-label="Натуральный дуб" style="--swatch:#ae8157"></button><button class="swatch" data-material="walnut" aria-label="Тёмный орех" style="--swatch:#513b2e"></button><button class="swatch" data-material="black" aria-label="Матовый чёрный" style="--swatch:#292b2b"></button><button class="swatch" data-material="concrete" aria-label="Бетон" style="--swatch:#a4a29a"></button><button class="swatch" data-material="white" aria-label="Тёплый белый" style="--swatch:#eceae4"></button></div><div class="finish" id="finishName">Натуральный дуб</div>
<div class="section-title">03 <span>КОМПЛЕКТАЦИЯ</span></div><div class="spec"><span>Вертикальные секции</span><strong id="cols">3</strong></div><div class="spec"><span>Горизонтальные ярусы</span><strong id="rows">4</strong></div><div class="spec"><span>Толщина панели</span><strong>18 мм</strong></div><p class="disclaimer">Количество секций автоматически зависит от размеров. Цены ниже демонстрационные, не являются предложением GESHA.</p>
<div class="pricebox"><span>Ориентировочная стоимость</span><strong id="price">—</strong><small>Пример расчёта, без доставки и монтажа</small></div><button class="primary" id="copy">Скопировать параметры ↗</button></aside></main>`;

const canvasHost = document.querySelector('#canvas');
const scene = new THREE.Scene(); scene.background = new THREE.Color('#ddd7ce');
const camera = new THREE.PerspectiveCamera(35, 1, 0.05, 100);
camera.position.set(3.7, 2.8, 5.6);
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true, powerPreference:'high-performance'});
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
canvasHost.appendChild(renderer.domElement);
const pmrem = new THREE.PMREMGenerator(renderer);
const env = pmrem.fromScene(new RoomEnvironment(), 0.04);
scene.environment = env.texture;
const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .06;
controls.minDistance=2.1; controls.maxDistance=12;
controls.maxPolarAngle=Math.PI/2-.03;
controls.target.set(0,1,0);
const hemi = new THREE.HemisphereLight('#ffffff','#aaa09a',1.45);scene.add(hemi);
const key = new THREE.DirectionalLight('#fff4e8',3.5);
key.position.set(-3,7,5);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-5;key.shadow.camera.right=5;key.shadow.camera.top=5;key.shadow.camera.bottom=-5;
key.shadow.normalBias=.025;key.shadow.bias=-.0001;key.shadow.radius=3;
scene.add(key);
const fill = new THREE.DirectionalLight('#e4edff',0.8);fill.position.set(4,3,-3);scene.add(fill);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#eae8e3',roughness:0.94}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
// Studio backdrop: matte plaster wall, wood-tone floor and baseboard.
const wall = new THREE.Mesh(new THREE.PlaneGeometry(200,30),new THREE.MeshStandardMaterial({color:'#d9d1c7',roughness:0.98}));
wall.position.set(0,7,-1.05);wall.receiveShadow=true;scene.add(wall);
const skirting = new THREE.Mesh(new THREE.BoxGeometry(40,.095,.065),new THREE.MeshStandardMaterial({color:'#eee9df',roughness:.68}));
skirting.position.set(0,.047,-.98);skirting.castShadow=true;scene.add(skirting);

const shelf = new THREE.Group();scene.add(shelf);
const matColors = {
  oak:{name:'Натуральный дуб',color:'#b58c60',roughness:.7},
  walnut:{name:'Тёмный орех',color:'#564033',roughness:.63},
  black:{name:'Матовый чёрный',color:'#272a2c',roughness:.76},
  concrete:{name:'Светлый бетон',color:'#aaa9a3',roughness:.9},
  white:{name:'Тёплый белый',color:'#e9e6de',roughness:.6}
};
const state={width:1800,height:2000,depth:350,material:'oak'};
// Procedural fine-grain maps: generated once, reused across parts. Texture tiling is
// defined in physical units on each part, not stretched with the whole furniture.
function makeSurface(kind){
  // Deterministic multi-frequency procedural grain, independent of geometry scaling.
  const cv=document.createElement('canvas');cv.width=1024;cv.height=1024;
  const cx=cv.getContext('2d');const img=cx.createImageData(1024,1024);
  function hash(x,y){let n=(x*374761393+y*668265263)|0;n=(n^(n>>>13))*1274126177;return ((n^(n>>>16))>>>0)/4294967295;}
  function smooth(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;const a=fx*fx*(3-2*fx),b=fy*fy*(3-2*fy);return (1-b)*((1-a)*hash(ix,iy)+a*hash(ix+1,iy))+b*((1-a)*hash(ix,iy+1)+a*hash(ix+1,iy+1));}
  for(let y=0;y<1024;y++)for(let x=0;x<1024;x++){
    const i=(y*1024+x)*4;
    const drift=24*(smooth(x/170,y/130)-.5)+10*(smooth(x/32,y/44)-.5);
    const grain=Math.sin(y*.28+drift)*8+Math.sin(y*.087+drift)*9+Math.sin(y*.9)*2.5;
    const n=kind==='wood'?grain+17*(smooth(x/130,y/75)-.5)+6*(hash(x,y)-.5):22*(smooth(x/75,y/75)-.5)+8*(hash(x,y)-.5);
    const v=Math.max(0,Math.min(255,130+n));
    img.data[i]=img.data[i+1]=img.data[i+2]=v;img.data[i+3]=255;
  }
  cx.putImageData(img,0,0);
  return cv;
}
const woodCanvas=makeSurface('wood'), concreteCanvas=makeSurface('concrete');
function materialFor(kind,w,h){
  const info=matColors[kind];
  const tex=new THREE.CanvasTexture(kind==='concrete'?concreteCanvas:woodCanvas);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.repeat.set(Math.max(.2,w/.48),Math.max(.2,h/.48));
  tex.colorSpace=THREE.NoColorSpace;
  tex.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  const bump = tex.clone();bump.needsUpdate=true;
  return new THREE.MeshStandardMaterial({color:info.color,roughness:info.roughness,metalness:0,roughnessMap:tex,bumpMap:bump,bumpScale:kind==='concrete'?.0005:.00025});
}
function board(w,h,d,x,y,z,kind){
  const bevel=.003;
  // Bevelled boxes use a rounded extruded 2D outline for soft highlights.
  const shape=new THREE.Shape();
  const r=Math.min(bevel,w/8,h/8);
  shape.moveTo(-w/2+r,-h/2);shape.lineTo(w/2-r,-h/2);
  shape.quadraticCurveTo(w/2,-h/2,w/2,-h/2+r);
  shape.lineTo(w/2,h/2-r);shape.quadraticCurveTo(w/2,h/2,w/2-r,h/2);
  shape.lineTo(-w/2+r,h/2);shape.quadraticCurveTo(-w/2,h/2,-w/2,h/2-r);
  shape.lineTo(-w/2,-h/2+r);shape.quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2);
  const geo=new THREE.ExtrudeGeometry(shape,{depth:d,bevelEnabled:true,bevelThickness:.0015,bevelSize:.0015,bevelSegments:2,curveSegments:3,steps:1});
  geo.translate(0,0,-d/2);
  const mesh=new THREE.Mesh(geo,materialFor(kind,w,h));mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;
  shelf.add(mesh);
}
function build(){
  shelf.traverse(o=>{if(o.isMesh){o.geometry.dispose();o.material.bumpMap?.dispose();o.material.roughnessMap?.dispose();o.material.dispose();}});
  shelf.clear();
  const W=state.width/1000,H=state.height/1000,D=state.depth/1000,t=.018;
  const cols=Math.max(1,Math.round(W/.60));
  const rows=Math.max(2,Math.round(H/.46));
  const m=state.material;
  // All boards maintain constant 18 mm thickness as dimensions change.
  board(t,H,D,-W/2+t/2,H/2,0,m);board(t,H,D,W/2-t/2,H/2,0,m);
  board(W-2*t,t,D,0,t/2,0,m);board(W-2*t,t,D,0,H-t/2,0,m);
  for(let c=1;c<cols;c++)board(t,H-2*t,D,-W/2+c*(W/cols),H/2,0,m);
  for(let r=1;r<rows;r++)board(W-2*t,t,D,0,r*(H/rows),0,m);
  document.querySelector('#cols').textContent=cols;
  document.querySelector('#rows').textContent=rows;
  const totalBoards=2*H*D+2*(W-2*t)*D+(cols-1)*(H-2*t)*D+(rows-1)*(W-2*t)*D;
  const factor=m==='walnut'?1.3:m==='black'?1.16:m==='concrete'?1.2:1;
  const price=Math.round((totalBoards*18500*factor+9000)/100)*100;
  document.querySelector('#price').textContent=new Intl.NumberFormat('ru-RU').format(price)+' ₽';
  document.querySelector('#finishName').textContent=matColors[m].name;
}
for(const key of ['width','height','depth']){
 const el=document.querySelector('#'+key);
 el.addEventListener('input',()=>{state[key]=Number(el.value);document.querySelector('#'+key+'Val').textContent=el.value;build();});
}
document.querySelectorAll('.swatch').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelector('.swatch.selected')?.classList.remove('selected');btn.classList.add('selected');state.material=btn.dataset.material;build();
}));
function front(){camera.position.set(0,1.65,5.7);controls.target.set(0,1.05,0);controls.update();}
document.querySelector('#reset').addEventListener('click',front);
document.querySelector('#shot').addEventListener('click',()=>{
 const oldW=canvasHost.clientWidth,oldH=canvasHost.clientHeight,oldRatio=renderer.getPixelRatio();
 const exportW=3840,exportH=2160;renderer.setPixelRatio(1);renderer.setSize(exportW,exportH,false);
 camera.aspect=exportW/exportH;camera.updateProjectionMatrix();renderer.render(scene,camera);
 const a=document.createElement('a');a.href=renderer.domElement.toDataURL('image/png');a.download='shelf-quality-4k.png';a.click();
 renderer.setPixelRatio(oldRatio);renderer.setSize(oldW,oldH,false);camera.aspect=oldW/oldH;camera.updateProjectionMatrix();
});
document.querySelector('#copy').addEventListener('click',async()=>{
 const msg=`Стеллаж: ${state.width} × ${state.height} × ${state.depth} мм; материал: ${matColors[state.material].name}; ${document.querySelector('#price').textContent} (демонстрационная цена)`;
 try{await navigator.clipboard.writeText(msg);document.querySelector('#copy').textContent='Скопировано ✓';setTimeout(()=>document.querySelector('#copy').textContent='Скопировать параметры ↗',1800)}catch{window.prompt('Скопируйте параметры:',msg)}
});
const resize=new ResizeObserver(()=>{const w=canvasHost.clientWidth,h=canvasHost.clientHeight;if(!w||!h)return;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);});resize.observe(canvasHost);
build();
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
</script></body></html>
